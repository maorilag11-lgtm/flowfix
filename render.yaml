{
  "services": [
    {
      "type": "web",
      "name": "flowfix-test",
      "runtime": "python",
      "plan": "free",
      "region": "frankfurt",
      "autoDeployTrigger": "off",
      "healthCheckPath": "/healthz",
      "envVars": [
        {
          "key": "FLOWFIX_DEV",
          "value": "0"
        },
        {
          "key": "FLOWFIX_TEST_DEPLOYMENT",
          "value": "1"
        },
        {
          "key": "PORT",
          "value": "8000"
        },
        {
          "key": "TRUST_PROXY",
          "value": "1"
        },
        {
          "key": "TRUST_CLIENT_IP",
          "value": "0"
        },
        {
          "key": "BILLING_ENABLED",
          "value": "0"
        },
        {
          "key": "SUPPORT_EMAIL",
          "value": "FlowFix.contact.support@gmail.com"
        },
        {
          "key": "DJANGO_SECRET_KEY",
          "generateValue": true
        },
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "flowfix-test-db",
            "property": "connectionString"
          }
        },
        {
          "key": "PYTHON_VERSION",
          "value": "3.12.12"
        }
      ],
      "buildCommand": "pip install -r requirements.lock",
      "startCommand": "python deploy/start_test.py"
    }
  ],
  "databases": [
    {
      "name": "flowfix-test-db",
      "plan": "free",
      "region": "frankfurt",
      "databaseName": "flowfix_test_db",
      "user": "flowfix_test_db_user",
      "postgresMajorVersion": "17",
      "ipAllowList": []
    }
  ]
}
